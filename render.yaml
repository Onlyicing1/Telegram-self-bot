services:
  - type: web
    name: lifeos
    env: python
    startCommand: python -m backend.main
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: BOT_OWNER_ID
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TZ
        value: Asia/Tehran
      - key: BIO_UPDATE_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        sync: false
      - key: AI_GEMINI_API_KEY
        sync: false
      - key: AI_OPENAI_API_KEY
        sync: false
      - key: AI_OPENROUTER_API_KEY
        sync: false
      - key: AI_GROQ_API_KEY
        sync: false
      - key: AI_CEREBRAS_API_KEY
        sync: false
      - key: AI_MISTRAL_API_KEY
        sync: false
      - key: AI_GEMINI_MODEL
        sync: false
      - key: AI_OPENAI_MODEL
        sync: false
      - key: AI_OPENROUTER_MODEL
        sync: false
      - key: AI_GROQ_MODEL
        sync: false
      - key: AI_CEREBRAS_MODEL
        sync: false
      - key: AI_MISTRAL_MODEL
        sync: false
